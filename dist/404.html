<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>FOLKI — Page introuvable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#08090b;--paper:#f5f5f2;--lime:#d7ff36;--blue:#1120ff;--muted:#a9abb4;--line:rgba(255,255,255,.13)}
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--ink)}
    body{min-height:100vh;margin:0;overflow-x:hidden;background:radial-gradient(ellipse 56% 66% at 75% 42%,rgba(17,32,255,.25),transparent 68%),radial-gradient(ellipse 34% 30% at 16% 86%,rgba(215,255,54,.06),transparent 72%),var(--ink);color:var(--paper);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:92px 92px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 82%)}
    a,button{font:inherit;color:inherit}
    a{text-decoration:none}
    .page{position:relative;z-index:1;min-height:100svh;width:100%;margin:0;padding:28px 5vw 32px;display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1280px;margin:0 auto;border-bottom:1px solid var(--line);padding-bottom:22px}
    .brand{font:700 1.6rem/1 "Space Grotesk",sans-serif;letter-spacing:-.09em}.brand span{color:var(--lime)}
    .code{color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
    main{flex:1;display:grid;width:100%;max-width:1280px;margin:0 auto;grid-template-columns:minmax(0,1fr) minmax(360px,440px);align-items:center;gap:1.5vw;padding:8vh 0 7vh}
    .copy{max-width:650px}
    .eyebrow{margin:0 0 22px;color:var(--lime);font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0 0 24px;font:600 clamp(3.3rem,7vw,7.8rem)/.88 "Space Grotesk",sans-serif;letter-spacing:-.075em;text-wrap:balance}
    h1 em{color:var(--lime);font-style:normal}
    .lead{max-width:470px;margin:0;color:#d4d5da;font-size:clamp(1rem,1.7vw,1.2rem);line-height:1.55}
    .actions{display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin-top:36px}
    .primary{display:inline-flex;align-items:center;gap:30px;background:var(--lime);color:var(--ink);padding:15px 18px;font-weight:700;transition:transform .18s ease,box-shadow .18s ease}
    .primary span{font-size:1.3rem;transition:transform .18s ease}.primary:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(215,255,54,.18)}.primary:hover span{transform:translate(3px,-3px)}
    .back{border:0;border-bottom:1px solid rgba(255,255,255,.55);background:none;padding:9px 0;color:#e7e7ea;font-weight:600;cursor:pointer;transition:color .18s ease}.back:hover{color:var(--lime)}
    .meta{display:flex;align-items:center;gap:12px;margin-top:42px;color:var(--muted);font-size:.75rem;letter-spacing:.04em}.meta:before{content:"";width:34px;height:1px;background:var(--lime)}
    .mascot-stage{position:relative;display:grid;place-items:center;min-height:500px;transform:translateX(-100px)}
    .mascot-stage:before{content:none}
    .mascot-stage:after{content:"✦";position:absolute;right:8%;top:11%;color:var(--lime);font-size:1.6rem}
    .mascot{position:relative;width:min(100%,430px);height:500px;object-fit:contain;filter:brightness(1.06) saturate(.9) contrast(1.04);mix-blend-mode:normal;-webkit-mask-image:radial-gradient(ellipse at center,rgba(0,0,0,1) 39%,rgba(0,0,0,.82) 52%,rgba(0,0,0,.2) 64%,transparent 72%);mask-image:radial-gradient(ellipse at center,rgba(0,0,0,1) 39%,rgba(0,0,0,.82) 52%,rgba(0,0,0,.2) 64%,transparent 72%)}
    .bubble{position:absolute;right:-3%;bottom:12%;padding:12px 15px;border:1px solid rgba(255,255,255,.24);border-radius:14px 14px 4px 14px;background:rgba(8,9,11,.72);backdrop-filter:blur(12px);color:#fff;font-size:.76rem;font-weight:700;letter-spacing:.02em;animation:bubble-in .7s .25s cubic-bezier(.16,1,.3,1) both}
    footer{display:flex;justify-content:space-between;width:100%;max-width:1280px;margin:0 auto;gap:20px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:.75rem}
    @keyframes float{0%,100%{transform:translateY(4px) rotate(-1.5deg)}50%{transform:translateY(-14px) rotate(1.5deg)}}@keyframes pulse{0%{opacity:.65;transform:scale(.9)}75%,100%{opacity:0;transform:scale(1.23)}}@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.75) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(18deg)}}@keyframes bubble-in{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}
    @media(max-width:760px){.page{padding:20px 6vw 24px}.topbar{padding-bottom:18px}main{grid-template-columns:1fr;gap:20px;padding:8vh 0 6vh}.copy{max-width:600px}.mascot-stage{order:-1;min-height:245px;transform:none}.mascot-stage:before{width:175px;height:175px}.mascot{width:205px;height:250px}.bubble{right:7%;bottom:4%;font-size:.68rem}.actions{margin-top:28px}.meta{margin-top:30px}footer{font-size:.68rem}}
    @media(prefers-reduced-motion:reduce){.mascot,.mascot-stage:before,.mascot-stage:after,.bubble{animation:none}}
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar"><a class="brand" href="/">FOLKI<span>•</span></a><span class="code">Erreur 404 / Page introuvable</span></header>
    <main>
      <section class="copy" aria-labelledby="error-title">
        <p class="eyebrow">Erreur 404</p>
        <h1 id="error-title">Page <em>introuvable.</em></h1>
        <p class="lead">Cette page n’existe pas ou a été déplacée.</p>
        <div class="actions"><a class="primary" href="/">Revenir à l’accueil <span>↗</span></a></div>
      </section>
      <div class="mascot-stage" aria-hidden="true"><img class="mascot" src="/assets/folki-404-adapted.png" alt=""></div>
    </main>
    <footer><span>Objets du quotidien, mieux choisis.</span><span>© 2026 FOLKI</span></footer>
  </div>
</body>
</html>
